name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint & Sintaks
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv

      - name: Validasi Composer
        run: composer validate --strict

      - name: Pemeriksaan Sintaks PHP
        run: find app routes tests config database -name "*.php" -exec php -l {} +

  test:
    name: Pengujian Unit & Fitur
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite
          coverage: none

      - name: Pasang Dependensi Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Siapkan Konfigurasi Lingkungan
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Siapkan Database SQLite
        run: |
          touch database/database.sqlite
          php artisan migrate --graceful

      - name: Jalankan Pengujian Otomatis
        run: php artisan test
